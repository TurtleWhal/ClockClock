; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board = clockclock_module
lib_deps = 
	../ClockSerial
	powerbroker2/SerialTransfer
	; khoih-prog/ESP32_PWM

extra_scripts = post:autoincrement.py

[env:Module]
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
	-D MOTOR_TEST=1
	; This firmware depends on dual-core: PWMTask runs alone on core 1, the
	; serial loop + esp_timer stepping on core 0. Do NOT define
	; CONFIG_FREERTOS_UNICORE (it was previously set here but is inert — the
	; precompiled FreeRTOS is dual-core regardless).
